<ol style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-3);align-items:baseline;font-size:{{ include.size | default: 'clamp(20px,2.4vw,28px)' }}">{% for s in include.steps %}<li{% if forloop.last %} style="font-style:italic"{% endif %}>{{ s }}</li>{% unless forloop.last %}<li aria-hidden="true" style="color:var(--color-accent)">→</li>{% endunless %}{% endfor %}</ol>
